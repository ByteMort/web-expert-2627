<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assign Task to User</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/task.css">
    <script src="/axios/axios.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="user_index.html">Users</a>
            <a href="task_index.html">Tasks</a>
            <a href="task-user.html">Assign Task</a>
        </nav>
    </header>

    <main>
        <div class="card">
            <h2>Assign Task to User</h2>
            <div class="alert-message" id="alertMessage"></div>
            <form id="assignTaskForm">
                <label for="userSelect">Select User</label>
                <select id="userSelect" name="userId" required>
                    <option value="">-- Choose User --</option>
                </select>

                <label for="taskSelect">Select Task</label>
                <select id="taskSelect" name="taskId" required>
                    <option value="">-- Choose Task --</option>
                </select>

                <button type="submit">Assign Task</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 All Rights Reserved.</p>
