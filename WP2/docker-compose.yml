volumes:
  mongo-db:


services:
  mongo:
    image: mongo:9.0
    container_name: mongo
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo-db:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ADMIN}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: mongo_express
    restart: always
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ADMIN}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASS}
      ME_CONFIG_BASICAUTH_USERNAME: ${MEXP_ADMIN}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MEXP_PASS}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ADMIN}:${MONGO_PASS}@mongo:27017